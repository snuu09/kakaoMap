<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>카카오 지도</title>
    <link rel="stylesheet" href="style.css?v=17" />
  </head>
  <body>
    <div class="controls">
      <form class="search-row" id="search-form">
        <input
          id="search-input"
          type="search"
          placeholder="장소, 주소 검색"
          autocomplete="off"
          data-i18n-placeholder="searchPlaceholder"
        />
        <button type="submit" class="btn btn-search" aria-label="검색" data-i18n-aria="searchAria">
          <svg
            class="btn-search-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
            <path
              d="M16.5 16.5L21 21"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span class="btn-search-label" data-i18n="search">검색</span>
        </button>
      </form>

      <div class="chips" role="group" aria-label="장소 필터" data-i18n-aria="filterGroup">
        <button type="button" class="chip is-active" data-filter="default">
          <img src="icons/default.svg" alt="" />
          <span data-i18n="chip.default">기본</span>
        </button>
        <button type="button" class="chip" data-filter="attractions" id="attractions-chip">
          <img class="chip-flag" src="icons/taegeukgi.svg" alt="" />
          <span data-i18n="chip.attractions">명소</span>
        </button>
        <button type="button" class="chip" data-filter="tourism" id="tourism-chip">
          <img src="icons/attraction.svg" alt="" />
          <span data-i18n="chip.tourism">관광</span>
        </button>
        <button type="button" class="chip" data-filter="스타벅스">
          <img src="icons/starbucks.svg" alt="" />
          스타벅스
        </button>
        <button type="button" class="chip" data-filter="메가커피">
          <img src="icons/mega-coffee.png" alt="" />
          메가커피
        </button>
        <button type="button" class="chip" data-filter="GS25">
          <img src="icons/gs25.svg" alt="" />
          GS25
        </button>
        <button type="button" class="chip" data-filter="CU">
          <img src="icons/cu.svg" alt="" />
          CU
        </button>
        <button
          type="button"
          class="chip chip-option"
          id="nearby-attractions"
          hidden
          aria-pressed="false"
          aria-label="내 근처만 보기"
          data-i18n-aria="chip.nearbyAria"
        >
          <span data-i18n="chip.nearby">내 근처</span>
        </button>
      </div>

      <div class="chips chips-sub" id="tourism-groups" hidden role="group" aria-label="관광 유형" data-i18n-aria="tourismTypes">
        <button type="button" class="chip chip-option" data-tourism-group="" aria-pressed="true">
          <span data-i18n="group.all">전체</span>
        </button>
        <button type="button" class="chip chip-option" data-tourism-group="mountain" hidden>
          <span data-i18n="group.mountain">산</span>
        </button>
        <button type="button" class="chip chip-option" data-tourism-group="sea" hidden>
          <span data-i18n="group.sea">바다</span>
        </button>
        <button type="button" class="chip chip-option" data-tourism-group="water" hidden>
          <span data-i18n="group.water">호수·강</span>
        </button>
        <button type="button" class="chip chip-option" data-tourism-group="leisure" hidden>
          <span data-i18n="group.leisure">휴양</span>
        </button>
        <button type="button" class="chip chip-option" data-tourism-group="experience" hidden>
          <span data-i18n="group.experience">체험</span>
        </button>
        <button type="button" class="chip chip-option" data-tourism-group="industry" hidden>
          <span data-i18n="group.industry">산업</span>
        </button>
        <button type="button" class="chip chip-option" data-tourism-group="architecture" hidden>
          <span data-i18n="group.architecture">건축</span>
        </button>
      </div>

      <div class="chips-sub-row" id="tourism-cat3-row" hidden>
        <span class="chips-sub-label" id="tourism-cat3-label">세부</span>
        <div class="chips chips-sub" id="tourism-cat3" role="group" aria-label="관광 세부 유형" data-i18n-aria="tourismDetails"></div>
      </div>

      <div class="area-info" id="area-info" hidden>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 21s7-6.2 7-11.2A7 7 0 0 0 5 9.8C5 14.8 12 21 12 21z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="9.8" r="2.2" fill="currentColor" />
        </svg>
        <span id="area-info-text"></span>
      </div>
    </div>

    <button
      type="button"
      class="btn-location"
      id="location-btn"
      aria-label="현재 위치로 이동"
      title="현재 위치"
      data-i18n-aria="location"
      data-i18n-title="locationTitle"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3" fill="currentColor" />
        <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.8" />
        <path
          d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <div class="map-tools" id="map-tools">
      <div class="tool-group tool-group-zoom">
        <button type="button" class="tool-btn" id="zoom-in" aria-label="확대" data-i18n-aria="zoomIn">
          +
        </button>
        <button type="button" class="tool-btn" id="zoom-out" aria-label="축소" data-i18n-aria="zoomOut">
          -
        </button>
      </div>

      <div class="layers-stack">
      <button
        type="button"
        class="tool-btn layers-toggle"
        id="layers-toggle"
        aria-expanded="false"
        aria-controls="map-layers"
        aria-label="지도 레이어"
        title="지도 레이어"
        data-i18n-aria="layers"
        data-i18n-title="layers"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 4l9 5-9 5-9-5 9-5z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="M5 14.5L12 18.5 19 14.5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M5 18L12 22l7-4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <div class="map-layers" id="map-layers">
        <div class="tool-group" role="group" aria-label="지도 타입" data-i18n-aria="mapTypes">
          <button type="button" class="tool-btn map-type is-active" data-type="ROADMAP">
            <span data-i18n="map.roadmap">지도</span>
          </button>
          <button type="button" class="tool-btn map-type" data-type="SKYVIEW">
            <span data-i18n="map.skyview">스카이뷰</span>
          </button>
          <button type="button" class="tool-btn map-type" data-type="HYBRID">
            <span data-i18n="map.hybrid">하이브리드</span>
          </button>
        </div>

        <div class="tool-group" role="group" aria-label="지도 오버레이" data-i18n-aria="overlayTypes">
          <button type="button" class="tool-btn map-overlay" data-overlay="TRAFFIC">
            <span data-i18n="overlay.traffic">교통정보</span>
          </button>
          <button type="button" class="tool-btn map-overlay" data-overlay="ROADVIEW">
            <span data-i18n="overlay.roadview">로드뷰</span>
          </button>
          <button type="button" class="tool-btn map-overlay" data-overlay="TERRAIN">
            <span data-i18n="overlay.terrain">지형</span>
          </button>
          <button type="button" class="tool-btn map-overlay" data-overlay="BICYCLE">
            <span data-i18n="overlay.bicycle">자전거</span>
          </button>
          <button
            type="button"
            class="tool-btn map-overlay"
            data-overlay="USE_DISTRICT"
          >
            <span data-i18n="overlay.district">지적편집도</span>
          </button>
        </div>
      </div>
      </div>

      <div class="lang-stack">
        <button
          type="button"
          class="tool-btn lang-toggle"
          id="lang-toggle"
          aria-expanded="false"
          aria-controls="lang-menu"
          aria-label="언어"
          title="언어"
          data-i18n-aria="lang"
          data-i18n-title="lang"
        >
          한
        </button>
        <div
          class="tool-group lang-menu"
          id="lang-menu"
          role="group"
          aria-label="언어"
          data-i18n-aria="lang"
        >
          <button type="button" class="tool-btn lang-option" data-lang="ko" aria-pressed="true">
            한
          </button>
          <button type="button" class="tool-btn lang-option" data-lang="en" aria-pressed="false">
            EN
          </button>
          <button type="button" class="tool-btn lang-option" data-lang="ja" aria-pressed="false">
            日
          </button>
          <button type="button" class="tool-btn lang-option" data-lang="zh" aria-pressed="false">
            中
          </button>
        </div>
      </div>
    </div>

    <div id="map"></div>

    <section class="sheet is-mid" id="place-sheet" hidden>
      <div class="sheet-grab" id="sheet-grab">
        <button
          type="button"
          class="sheet-handle"
          id="sheet-toggle"
          aria-label="바텀시트 크기 조절"
          data-i18n-aria="sheetToggleMid"
        ></button>
        <div class="sheet-header">
          <div>
            <h2 id="sheet-title">검색 결과</h2>
            <p id="sheet-count"></p>
          </div>
        </div>
      </div>
      <ul class="sheet-list" id="place-list"></ul>
    </section>

    <section class="sheet is-mid" id="place-detail" hidden>
      <div class="sheet-grab" id="detail-grab">
        <button
          type="button"
          class="sheet-handle"
          id="detail-toggle"
          aria-label="바텀시트 크기 조절"
          data-i18n-aria="sheetToggleMid"
        ></button>
        <div class="sheet-header sheet-header-detail">
          <button
            type="button"
            class="sheet-back"
            id="detail-back"
            aria-label="뒤로"
            data-i18n-aria="back"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M15 5l-7 7 7 7"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <div>
            <h2 id="detail-title">장소</h2>
            <p id="detail-meta"></p>
          </div>
        </div>
      </div>
      <div class="sheet-detail-body" id="detail-body"></div>
    </section>

    <div class="dialog-backdrop" id="dialog" hidden>
      <div
        class="dialog"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="dialog-title"
        aria-describedby="dialog-message"
      >
        <h2 id="dialog-title" data-i18n="dialogTitle">알림</h2>
        <p id="dialog-message"></p>
        <button type="button" class="btn btn-search" id="dialog-close">
          <span data-i18n="ok">확인</span>
        </button>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="i18n.js?v=16"></script>
    <script src="app.js?v=16"></script>
  </body>
</html>
